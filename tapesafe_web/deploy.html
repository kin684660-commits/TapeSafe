<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TapeSafe 部署助手</title><link rel="stylesheet" href="app.css"></head><body><div class="shell"><header><div><h1>TapeSafe 部署助手</h1><p>按顺序完成三笔交易，由你在钱包中签名。</p></div><button id="connect" class="primary">连接钱包</button></header><main>
<section class="card"><h2>固定部署参数</h2><p>X Layer 196 · TapeSafe / TSAFE · 供应上限 210000 · 单价 0.000066 OKB</p><p>只部署处理器和 74 NAND 审批电路，协议费和 gas 另付。未审计原型。</p><p class="hash" id="account">尚未连接钱包</p></section>
<section class="card"><h2>1 → 2 → 3</h2><div class="row"><button id="create" class="primary" disabled>① 准备创建处理器</button><button id="mint" class="ghost" disabled>② 准备铸造 74 NAND</button><button id="tapeout" class="ghost" disabled>③ 准备流片</button></div><p>先准备并模拟，检查金额后再点击下面的签名按钮。</p></section>
<section id="review" class="card" hidden><h2>本次交易核对</h2><div id="summary"></div><button id="sign" class="primary">打开钱包确认这笔交易</button></section>
<section class="card"><h2>进度与结果</h2><p id="status" role="status">先连接钱包。连接不会发送交易。</p><pre id="result" class="hash" style="white-space:pre-wrap"></pre><div class="row"><button id="resume" class="ghost" disabled>继续检查已发送交易</button><button id="export" class="ghost">下载部署记录</button></div><p><a href="index.html#/demo">电路实验室</a></p></section>
</main></div><script src="config.js"></script><script src="abi.js"></script><script src="policy.js"></script><script src="deploy-core.js"></script><script src="deploy.js"></script></body></html>
